    TypicalPhrasesLikertLabel: ¿Qué tan correcta es esta definición?
    TypicalPhrasesLikertInfo: "1 = Incorrecta, 5 = Muy correcta"
    TypicalPhrasesLLMResponsesButton: ¿Cómo responden los modelos de lenguaje?
    TypicalPhrasesSystemPromptDefine: Define la siguiente expresión de forma clara. La definición debe estar en español, ser precisa y concisa, y no superar las 40 palabras. No incluyas explicaciones adicionales, ejemplos ni información fuera de la definición. Responde solo con la definición.

pt:
    # Global Input Labels
    Identifier: Identificador
    TokenInfo: Insira o identificador fornecido no workshop
    AgeLabel: Insira sua idade
    GenderLabel: Selecione seu gênero
    NationalityLabel: De onde você é?
    NationalityInfo: Selecione as nacionalidades que representam sua identidade cultural, pessoal ou nacional
    PersonalRegionLabel: Qual região?
    ConsentLabel: Li e aceito o consentimento informado ⬇️
    PersonalDataMissingHeading: "# Insira seus dados pessoais e confirme seu consentimento para continuar."
    SchoolLabel: Selecione sua escola (Veja ⬇️)
    SchoolNamePlaceholder: Você não selecionou nenhuma escola

    # Tab Names
    TypicalPhrasesTab: Expressões Típicas

    # Common Labels
    ModelALabel: Modelo A
    ModelBLabel: Modelo B
    ModelCLabel: Modelo C
    NextButton: Próximo

    # Typical Phrases Tab
    TypicalPhrasesAnnotationTitle: Atividade de Expressões Típicas
    TypicalPhrasesAnnotationGoal: O objetivo é descobrir se os modelos de linguagem conhecem o significado dessas expressões típicas ou se inventam respostas.
    TypicalPhrasesAnnotationInstructions: Por favor, adicione uma expressão típica da sua região, forneça seu significado e use-a em uma frase.
    TypicalPhrasesNewPhraseLabel: "Forneça uma expressão típica da sua cultura:"
    TypicalPhrasesNewPhrasePlaceholder: Digite a expressão aqui
    TypicalPhrasesNewPhraseDefinitionLabel: "Forneça uma definição:"
    TypicalPhrasesNewPhraseDefinitionPlaceholder: Digite a definição aqui
    TypicalPhrasesNewPhraseSentenceLabel: "Use-a em uma frase:"
    TypicalPhrasesNewPhraseSentencePlaceholder: Digite a frase aqui
    TypicalPhrasesLLMHeader: Aqui você verá como os modelos de linguagem de diferentes tamanhos definem sua expressão.
    TypicalPhrasesLikertLabel: Quão correta é esta definição?
    TypicalPhrasesLikertInfo: "1 = Incorreta, 5 = Muito correta"
    TypicalPhrasesLLMResponsesButton: Como os modelos de linguagem respondem?
    TypicalPhrasesSystemPromptDefine: Defina a seguinte expressão de forma clara. A definição deve estar em português, ser precisa e concisa, e não ultrapassar 40 palavras. Não inclua explicações adicionais, exemplos ou informações fora da definição. Responda apenas com a definição.
