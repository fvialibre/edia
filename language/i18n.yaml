    AmbiguousReferencesRight: Direita
    AmbiguousReferencesLLMHeader: Aqui você verá como diferentes modelos de linguagem respondem à sua pergunta. As respostas são geradas automaticamente para mostrar como os modelos poderiam responder à pergunta que você escreveu.
